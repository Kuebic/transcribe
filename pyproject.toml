[project]
name = "transcribe"
version = "0.1.0"
description = "LAN-only web app that turns audio Recordings into Transcripts with Whisper"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only the container installs Whisper (and torch with it); tests use a fake Transcriber.
whisper = [
    "openai-whisper>=20250625",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
transcribe = "transcribe.main:serve"
