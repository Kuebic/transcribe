{% extends "base.html" %}
{% block title %}Upload · Transcribe{% endblock %}
{% block scripts %}<script src="/static/upload.js" defer></script>{% endblock %}
{% block content %}
<h1>Upload Recordings</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="upload" method="post" action="/upload" enctype="multipart/form-data">
  <label>Audio
    <input type="file" name="files" multiple required
           accept="{% for ext in accepted_extensions %}.{{ ext }}{% if not loop.last %},{% endif %}{% endfor %}">
  </label>
  <label>Kind
    <select name="kind_id" required>
      {% for kind in kinds %}
      <option value="{{ kind.id }}"{% if kind.id == selected_kind_id %} selected{% endif %}>{{ kind.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Title
    <input type="text" name="title" value="{{ title }}" placeholder="Defaults to the filename; several files keep their filenames">
  </label>
  <label>Language
    <select name="language">
      {% for code, name in languages.items() %}
      <option value="{{ code }}"{% if code == selected_language %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Upload</button>
  <div class="upload-progress" hidden aria-live="polite">
    <progress max="100" value="0"></progress>
    <p class="upload-status"></p>
  </div>
</form>
{% endblock %}
